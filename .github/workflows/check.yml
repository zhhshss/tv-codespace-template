name: Template checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Check devcontainer JSON
        run: python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Exercise fixture and scripts
        run: python3 -m unittest discover -s tests -v
